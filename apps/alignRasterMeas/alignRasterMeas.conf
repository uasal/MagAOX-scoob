[shmimMonitor]
shmimName=camsci

[fsm]
device=fsm_sim
prop1=val_1
prop2=val_2

[meas]
# Device publishing mask_center (aperture position in pixels).
device=alignPSFMeas

[raster]
# Half-number of grid steps per axis; total scan = (2H+1)^2 points.
halfSteps=30
# Grid step size in ttp units
# ~3.3e-8 corresponds to ~2 px in the current simulator calibration
# Let's try steps of 0.2 px
stepSize=3.3e-9
# Camera frames to discard after each FSM command (settling).
settleFrames=20
# Camera frames to average per grid point.
measureFrames=5
# Radius (pixels) of the intensity aperture centred on the mask centre.
centerRadius=30.0
# Publish the measured intensity grid to a debug shmim (<name>_dbg_map) at
# scan end, for inspecting the surface shape. Also settable at runtime via
# the INDI 'debug_map' toggle. Default false.
debugMap=true
