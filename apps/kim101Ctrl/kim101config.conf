[power]
device=pdu0
channel=appName

# USB: 8-digit serial string from the device (lsusb -v, or Kinesis)
[device]
serial=12345678

# Drive limits for inertial moves (see APT / handbook; volts 85–125)
[drive]
maxVoltage=110
stepRate=500
stepAccn=100000

# Joystick / panel-style jog parameters used by kim_move_jog path
[jog]
mode=2
stepSize=100
stepRate=500
stepAccn=100000
