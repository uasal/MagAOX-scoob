[shmimMonitor]
shmimName=camsci

[refIm]
shmimName=alignPSFMeas_ref

[align]
# Sensing method:
# 1 = restricted-area cross-correlation (default)
# 2 = speckle centroid
method=2

# --- Method 1 ---
maxLag=30
tol=0.001
padFactor=1.0
# Half-width (pixels) of the search box used after the initial detection.
# Must be smaller than half the speckle separation to exclude false peaks.
searchHalfWidth=50

# --- Speckle geometry (used by both methods) ---
# Distance from PSF centre to each first-order speckle (pixels).
speckleSep=150.0
# Angle of the first speckle from the image row axis (degrees).
# 45 degrees matches a DM waffle with equal freq in x and y.
speckleAngle=45.0

# --- Measurement failure policy (all methods) ---
# Consecutive frames without a valid measurement before the loop is opened
# and the app holds ERROR.  Recover by re-closing the loop (loop_state),
# which resets the counter and the ERROR latch.  With Method 2's detector
# running at ~25-40 Hz, 50 frames is roughly 1.5-2 seconds. Default 50.
failLimit=50

# --- Speckle detector (Method 2 every frame; Method 1 bootstrap) ---
# Radius (pixels) of the background-subtracted window used to centroid
# speckles. Default 6.
#centroidRadius=6
# Max number of local-maxima candidates kept for the speckle quad search.
# Default 24.
#maxPeakCands=24
# Max raw-flux ratio between the brightest and faintest speckle in a
# candidate quad. Measured: true siblings spread ~1.1x, imposters mix rungs
# >= 6.5x apart. Default 3.
#quadFluxRatio=3.0

# Detector fallback: when no speckle quad exists (speckles off-frame at large
# offsets, or one occulted while transiting the mask), a candidate whose raw
# flux dominates all others by this factor is identified as the unsuppressed
# core and used directly as the PSF position.  Measured ladder: core/1st
# ~60x, 1st/2nd ~10x. Default 25.
#coreDomFactor=25

# Publish debug image shmims (<name>_dbg_smooth, _dbg_cands, _dbg_quad) on the
# first and every Nth detection attempt. 0 (default) disables. Also settable
# at runtime via the INDI property 'debug_imgs'.
#debugImgEvery=0

# Method 1: assumed loop gain for predicting next-frame PSF position.
# 0 = assume no correction (search at last measured position).
# 1 = assume full correction (search near mask centre).
# NB: must be kept in step with loop.gain in alignLoop.conf -- this is a
# duplicated value. Method 2 does not use it.
predGain=0.1

# mask_center is consumed by other apps (alignRasterMeas) but changes only
# rarely, so it is re-asserted at this interval (seconds) while the app is
# processing frames. Without it a subscriber that starts later never receives
# the value, because INDI's replay of a cached property does not reach driver
# subscriptions here. 0 disables.
#maskCenterRepublish=10.0

# Target PSF position in pixels. Defaults to image centre if omitted.
#maskCenterX=256
#maskCenterY=256

# Photometric fine alignment (the intensity-minimising raster scan) now lives
# in the separate alignRasterMeas app, which commands the FSM directly.
# See /opt/MagAOX/config/alignRasterMeas.conf.
