[input]
device=alignPSFMeas
property=measurement
elements=delta_x,delta_y
counterElement=counter
references=0,0

[ctrl]
devices=fsm_sim
properties=val_1,val_2
# Readback gating: send the next command only after val_*.current matches the
# last sent target (relative tolerance), so commands can never queue up in the
# INDI chain and go stale.  If the readback never matches (e.g. a lost
# message), the command is resent after readbackTimeout seconds with a warning.
readbackTolerance=1e-4
readbackTimeout=2.0

[loop]
# Global gain.  Default is 0 (loop sends nothing).
gain=0.1
# Per-axis gains (multiplied by global gain).
gains=1,1
# Interaction matrix: maps (delta_x, delta_y) -> (val_1_cmd, val_2_cmd).
# Default identity assumes val_1 is camera-x and val_2 is camera-y with 1:1 scale.
# Calibrate by poking each FSM axis and measuring resulting pixel shift.
intMat00=1.76e-8
intMat01=1.42e-9
intMat10=-3.55e-9
intMat11=1.31e-8