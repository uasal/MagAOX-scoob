name: Valgrind
on:
  push:
      branches:
        - '**' # Any branch
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/joseph-long/magao-x-setup-develop:main
      options: --user root
    steps:
      - name: Install Packages
        run: dnf install -y valgrind make libusb-devel libusbx-devel
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$(pwd)"
      - name: Run Valgrind
        id: valgrind  
        run: |
          set +e
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          pkg-config --modversion openblas
          make valgrind
          cd tests/valgrind
          chmod +x valgrind.sh
          bash -l valgrind.sh
          rc=$?
          echo "exitcode=$rc" >> "$GITHUB_OUTPUT"
      # Run regardless of previous step result
      - name: Upload Valgrind Logs as Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: tests/valgrind/logs
      # Fail if valgrind's exit code was non-zero
      - name: Fail if valgrind failed
        if: always()
        run: |
          rc="${{ steps.valgrind.outputs.exitcode }}"
          echo "Valgrind exit code: $rc"
          if [ "$rc" = "1" ]; then
            echo "Valgrind returned exit code 1. Failing job."
            exit 1
          fi