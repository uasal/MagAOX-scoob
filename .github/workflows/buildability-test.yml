name: Verify buildability
permissions:
  contents: read
  packages: read
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'
jobs:
  build-x86:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/magao-x/magao-x-setup:build
      options: --user root
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$(pwd)"
      - name: Build MagAO-X software
        run: |
          pwd
          ls -la
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
          source /opt/rh/gcc-toolset-14/enable
          cd flatlogs/src
          make
          make install
          cd ../..
          make setup
          make libs_all
          make all
          make install
  build-arm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/magao-x/magao-x-setup:build
      options: --user root
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$(pwd)"
      - name: Build MagAO-X software
        run: |
          pwd
          ls -la
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH}"
          source /opt/rh/gcc-toolset-14/enable
          cd flatlogs/src
          make
          make install
          cd ../..
          make setup
          make libs_all
          make all
          make install
